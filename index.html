<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flo & Nico: Flohmarkt Schatzsuche</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #1e1b4b; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f172a; }
    canvas { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* UI Overlay */
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.96); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; text-align: center; }
    .hidden { display: none !important; }

    h1 { font-size: 2.2rem; margin-bottom: 8px; color: #f59e0b; text-shadow: 0 0 15px rgba(245,158,11,0.5); font-weight: 800; }
    .subtitle { color: #cbd5e1; font-size: 1rem; margin-bottom: 25px; max-width: 380px; line-height: 1.4; }

    .char-select { display: flex; gap: 15px; margin-bottom: 30px; }
    .char-card { background: #1e293b; border: 3px solid #475569; border-radius: 16px; padding: 18px 15px; width: 140px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .char-card.selected { border-color: #f59e0b; background: #0f172a; transform: translateY(-4px); box-shadow: 0 12px 25px rgba(245,158,11,0.3); }
    .char-card h3 { color: #f8fafc; font-size: 1.2rem; margin-bottom: 6px; }
    .char-card p { font-size: 0.75rem; color: #f59e0b; margin: 0; }

    .btn { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; border: none; padding: 16px 40px; font-size: 1.3rem; font-weight: bold; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 20px rgba(217,119,6,0.5); }
    .btn:active { transform: scale(0.96); }

    /* HUD */
    #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; font-size: 1.2rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .hud-box { background: rgba(15, 23, 42, 0.85); padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(4px); }

    /* Touch Controls */
    #touch-controls { position: absolute; inset: 0; pointer-events: none; z-index: 50; display: flex; justify-content: space-between; padding: 25px; align-items: flex-end; }
    .touch-group { display: flex; gap: 15px; pointer-events: auto; }
    .touch-btn { width: 72px; height: 72px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.6rem; color: #fff; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .touch-btn:active { background: rgba(245,158,11,0.5); border-color: #f59e0b; transform: scale(0.92); }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <!-- HUD Ingame -->
  <div id="hud" class="hidden">
    <div class="hud-box" id="score-display">Schätze: 0 / 5</div>
    <div class="hud-box" id="char-display">Flo</div>
  </div>

  <!-- Startbildschirm -->
  <div id="start-overlay" class="overlay">
    <h1>Flohmarkt Schatzsuche</h1>
    <p class="subtitle">Erkunde den Flohmarkt mit Flo & Nico, stöbere an Ständen und finde seltene CardSkope Schätze!</p>
    
    <div class="char-select">
      <div class="char-card selected" id="card-flo" onclick="selectChar('Flo')">
        <h3>Flo</h3>
        <p>⚡ Schnell & Agil</p>
      </div>
      <div class="char-card" id="card-nico" onclick="selectChar('Nico')">
        <h3>Nico</h3>
        <p>🦘 Höherer Sprung</p>
      </div>
    </div>

    <button class="btn" onclick="startGame()">SCHATZSUCHE STARTEN</button>
  </div>
</div>

<!-- Touch Steuerung -->
<div id="touch-controls" class="hidden">
  <div class="touch-group">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>
  <div class="touch-group">
    <div class="touch-btn" id="btn-jump" style="background: rgba(245,158,11,0.25); border-color: #f59e0b;">▲</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  let gameRunning = false;
  let score = 0;
  let selectedChar = 'Flo';

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function selectChar(char) {
    selectedChar = char;
    document.getElementById('card-flo').classList.toggle('selected', char === 'Flo');
    document.getElementById('card-nico').classList.toggle('selected', char === 'Nico');
  }

  const player = {
    x: 100, y: 100, width: 42, height: 64,
    vx: 0, vy: 0, speed: 6, jumpPower: -14, grounded: false
  };

  const keys = { left: false, right: false, up: false };

  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if(e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
  });
  window.addEventListener('keyup', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if(e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
  });

  function bindTouch(id, keyName) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[keyName] = true; });
    el.addEventListener('touchend', e => { e.preventDefault(); keys[keyName] = false; });
    el.addEventListener('mousedown', () => keys[keyName] = true);
    el.addEventListener('mouseup', () => keys[keyName] = false);
  }
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-jump', 'up');

  // Flohmarkt Stände (Plattformen)
  const platforms = [
    { x: 0, y: window.innerHeight - 90, w: 3200, h: 90, type: 'ground' }, // Asphalt / Boden
    { x: 350, y: window.innerHeight - 200, w: 220, h: 25, type: 'table' }, // Flohmarktstand 1
    { x: 680, y: window.innerHeight - 300, w: 200, h: 25, type: 'table' }, // Stand 2
    { x: 980, y: window.innerHeight - 210, w: 240, h: 25, type: 'table' }, // Stand 3
    { x: 1300, y: window.innerHeight - 330, w: 220, h: 25, type: 'table' }, // Stand 4
    { x: 1650, y: window.innerHeight - 240, w: 260, h: 25, type: 'table' }  // Finaler Stand
  ];

  // Seltene Flohmarkt Schätze & CardSkope Items
  const treasures = [
    { x: 440, y: window.innerHeight - 250, type: 'CardSkope Karte', collected: false },
    { x: 760, y: window.innerHeight - 350, type: 'Retro Konsole', collected: false },
    { x: 1080, y: window.innerHeight - 260, type: 'Vintage Comic', collected: false },
    { x: 1400, y: window.innerHeight - 380, type: 'Seltene Gold-Karte', collected: false },
    { x: 1760, y: window.innerHeight - 290, type: 'Mega Schatztruhe', collected: false }
  ];

  let cameraX = 0;

  function startGame() {
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('touch-controls').classList.remove('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('char-display').innerText = 'Spieler: ' + selectedChar;

    if(selectedChar === 'Flo') {
      player.speed = 6.5;
      player.jumpPower = -14;
    } else {
      player.speed = 5.5;
      player.jumpPower = -16.5; // Nico springt etwas höher
    }

    gameRunning = true;
    requestAnimationFrame(loop);
  }

  function loop() {
    if (!gameRunning) return;

    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.75;

    if (keys.up && player.grounded) {
      player.vy = player.jumpPower;
      player.grounded = false;
    }

    player.vy += 0.65;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;

    player.grounded = false;
    platforms.forEach(p => {
      if (player.x + player.width > p.x && player.x < p.x + p.w &&
          player.y + player.height > p.y && player.y + player.height - player.vy <= p.y) {
        player.grounded = true;
        player.vy = 0;
        player.y = p.y - player.height;
      }
    });

    cameraX = player.x - canvas.width / 3;
    if (cameraX < 0) cameraX = 0;

    treasures.forEach(t => {
      if (!t.collected &&
          player.x < t.x + 35 && player.x + player.width > t.x - 10 &&
          player.y < t.y + 40 && player.y + player.height > t.y - 10) {
        t.collected = true;
        score++;
        document.getElementById('score-display').innerText = `Schätze: ${score} / ${treasures.length}`;
        if (score === treasures.length) {
          setTimeout(() => alert("🎉 Herzlichen Glückwunsch! Ihr habt alle Schätze auf dem Flohmarkt gefunden!"), 200);
        }
      }
    });

    // --- ZEICHNEN DES FLOHMARKTES ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Markt-Himmel / Hintergrund (Abendstimmung auf dem Flohmarkt)
    let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#1e1b4b');
    bgGrad.addColorStop(1, '#312e81');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Hintergrund-Dekoration (Flohmarktzelte & Lichterketten)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
    for(let i = 200; i < 3000; i += 450) {
      ctx.fillRect(i, canvas.height - 380, 280, 290);
      // Zelt-Dach
      ctx.beginPath();
      ctx.moveTo(i - 20, canvas.height - 380);
      ctx.lineTo(i + 140, canvas.height - 460);
      ctx.lineTo(i + 300, canvas.height - 380);
      ctx.fill();
    }

    // Boden / Asphalt
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, window.innerHeight - 90, 3200, 90);
    ctx.fillStyle = '#334155';
    ctx.fillRect(0, window.innerHeight - 90, 3200, 6); // Bordsteinkante

    // Stand-Tische & Markttische zeichnen
    platforms.forEach(p => {
      if (p.type === 'table') {
        // Tischbeine
        ctx.fillStyle = '#78350f';
        ctx.fillRect(p.x + 20, p.y + p.h, 12, 90);
        ctx.fillRect(p.x + p.w - 32, p.y + p.h, 12, 90);
        // Tischplatte (Holzoptik)
        ctx.fillStyle = '#b45309';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(p.x, p.y, p.w, 5); // Tischkante
      }
    });

    // Schätze (CardSkope Karten, Kisten, Raritäten) zeichnen
    treasures.forEach(t => {
      if (!t.collected) {
        // Leuchten-Effekt
        ctx.fillStyle = 'rgba(245, 158, 11, 0.3)';
        ctx.beginPath();
        ctx.arc(t.x + 15, t.y + 15, 25, 0, Math.PI * 2);
        ctx.fill();

        // Schatz-Box / Karte
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(t.x, t.y, 30, 35);
        ctx.fillStyle = '#fff';
        ctx.fillRect(t.x + 4, t.y + 4, 22, 27);
        ctx.fillStyle = '#b45309';
        ctx.fillRect(t.x + 10, t.y + 12, 10, 10);
      }
    });

    // Spieler zeichnen (Flohmarkt-Outfit Farben)
    ctx.fillStyle = selectedChar === 'Flo' ? '#38bdf8' : '#f59e0b';
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Augen / Blickrichtung
    ctx.fillStyle = '#0f172a';
    let eyeOffsetX = player.vx >= 0 ? 26 : 6;
    ctx.fillRect(player.x + eyeOffsetX, player.y + 12, 8, 8);

    ctx.restore();

    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
