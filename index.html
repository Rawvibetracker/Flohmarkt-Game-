<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flo & Nico: Flohmarkt Schatzsuche</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
    canvas { display: block; background: #1e293b; width: 100%; height: 100%; object-fit: contain; }
    
    /* Overlay Menüs */
    .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; padding: 20px; text-align: center; }
    .hidden { display: none !important; }
    h1 { font-size: 1.8rem; margin-bottom: 10px; color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
    p { margin-bottom: 20px; color: #94a3b8; font-size: 0.95rem; max-width: 400px; }
    
    .char-select { display: flex; gap: 15px; margin-bottom: 25px; }
    .char-card { background: #334155; border: 2px solid #475569; border-radius: 12px; padding: 15px; width: 130px; cursor: pointer; transition: all 0.2s; }
    .char-card.selected { border-color: #38bdf8; background: #1e293b; transform: scale(1.05); box-shadow: 0 0 15px rgba(56,189,248,0.4); }
    .char-card h3 { color: #f8fafc; font-size: 1.1rem; margin-bottom: 5px; }
    .char-card span { font-size: 0.8rem; color: #38bdf8; }

    .btn { background: #0284c7; color: #fff; border: none; padding: 16px 32px; font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 12px rgba(2,132,199,0.5); z-index: 60; }
    .btn:active { transform: scale(0.95); background: #0369a1; }

    /* Touch Controls */
    #touch-controls { position: absolute; inset: 0; pointer-events: none; z-index: 40; display: flex; justify-content: space-between; padding: 20px; align-items: flex-end; }
    .touch-btn { pointer-events: auto; width: 70px; height: 70px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.5rem; color: #fff; backdrop-filter: blur(4px); }
    .touch-btn:active { background: rgba(56,189,248,0.5); border-color: #38bdf8; }
    .d-pad { display: flex; gap: 12px; }
    .action-pad { display: flex; gap: 12px; }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <!-- Startscreen Overlay -->
  <div id="start-overlay" class="overlay">
    <h1>Flohmarkt Schatzsuche</h1>
    <p>Wähle deinen Charakter und finde die wertvollsten CardSkope Schätze!</p>
    
    <div class="char-select">
      <div class="char-card selected" id="char-flo">
        <h3>Flo</h3>
        <span>High Jump</span>
      </div>
      <div class="char-card" id="char-nico">
        <h3>Nico</h3>
        <span>Double Jump</span>
      </div>
    </div>

    <button class="btn" id="start-btn">SPIEL STARTEN</button>
  </div>

  <!-- Touch Controls -->
  <div id="touch-controls">
    <div class="d-pad">
      <div class="touch-btn" id="btn-left">◄</div>
      <div class="touch-btn" id="btn-right">►</div>
    </div>
    <div class="action-pad">
      <div class="touch-btn" id="btn-jump" style="background: rgba(56,189,248,0.2); border-color: #38bdf8;">▲</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const startOverlay = document.getElementById('start-overlay');
  const startBtn = document.getElementById('start-btn');

  let selectedChar = 'Flo';
  let gameRunning = false;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function selectChar(char) {
    selectedChar = char;
    document.getElementById('char-flo').classList.toggle('selected', char === 'Flo');
    document.getElementById('char-nico').classList.toggle('selected', char === 'Nico');
  }

  // Touch & Click für Charakterauswahl
  document.getElementById('char-flo').addEventListener('touchend', (e) => { e.preventDefault(); selectChar('Flo'); });
  document.getElementById('char-flo').addEventListener('click', () => selectChar('Flo'));
  document.getElementById('char-nico').addEventListener('touchend', (e) => { e.preventDefault(); selectChar('Nico'); });
  document.getElementById('char-nico').addEventListener('click', () => selectChar('Nico'));

  // Spieler Objekt
  const player = {
    x: 100, y: 100, width: 40, height: 60,
    vx: 0, vy: 0,
    speed: 5, jumpPower: -13,
    grounded: false
  };

  const keys = { left: false, right: false, up: false };

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
  });

  function bindTouch(id, keyProp) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; });
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; });
    el.addEventListener('mousedown', () => keys[keyProp] = true);
    el.addEventListener('mouseup', () => keys[keyProp] = false);
  }
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-jump', 'up');

  // Plattformen
  const platforms = [
    { x: 0, y: window.innerHeight - 50, w: 3000, h: 50 },
    { x: 250, y: window.innerHeight - 160, w: 160, h: 20 },
    { x: 500, y: window.innerHeight - 260, w: 160, h: 20 },
    { x: 750, y: window.innerHeight - 180, w: 200, h: 20 }
  ];

  function update() {
    if (!gameRunning) return;

    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.8;

    if (keys.up && player.grounded) {
      player.vy = player.jumpPower;
      player.grounded = false;
    }

    player.vy += 0.6;
    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;
    platforms.forEach(p => {
      if (player.x < p.x + p.w && player.x + player.width > p.x &&
          player.y + player.height > p.y && player.y + player.height - player.vy <= p.y) {
        player.grounded = true;
        player.vy = 0;
        player.y = p.y - player.height;
      }
    });

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#475569';
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

    ctx.fillStyle = selectedChar === 'Flo' ? '#38bdf8' : '#eab308';
    ctx.fillRect(player.x, player.y, player.width, player.height);

    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + (player.vx >= 0 ? 25 : 5), player.y + 10, 8, 8);

    requestAnimationFrame(update);
  }

  // SPIEL STARTEN FUNKTION (für Touch & Click)
  function startGame(e) {
    if(e) e.preventDefault();
    startOverlay.classList.add('hidden');
    gameRunning = true;
    
    if (selectedChar === 'Flo') {
      player.jumpPower = -15;
      player.speed = 5;
    } else {
      player.jumpPower = -12;
      player.speed = 7;
    }
    update();
  }

  startBtn.addEventListener('click', startGame);
  startBtn.addEventListener('touchend', startGame);
</script>
</body>
</html>
