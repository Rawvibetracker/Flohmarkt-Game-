<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flo & Nico: Flohmarkt Schatzsuche</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #05070a; }
    canvas { display: block; background: linear-gradient(to bottom, #1e1b4b, #311042); width: 100%; height: 100%; object-fit: contain; }

    /* UI Overlay (Start & Game Over) */
    .overlay { position: absolute; inset: 0; background: rgba(9, 13, 22, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; text-align: center; backdrop-filter: blur(8px); }
    .hidden { display: none !important; }

    h1 { font-size: 2.2rem; margin-bottom: 8px; color: #38bdf8; text-shadow: 0 0 20px rgba(56,189,248,0.6); font-weight: 800; }
    .subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 25px; max-width: 350px; line-height: 1.4; }

    .char-select { display: flex; gap: 15px; margin-bottom: 30px; }
    .char-card { background: #1e293b; border: 3px solid #334155; border-radius: 16px; padding: 18px 15px; width: 140px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .char-card.selected { border-color: #38bdf8; background: #0f172a; transform: translateY(-4px); box-shadow: 0 12px 25px rgba(56,189,248,0.3); }
    .char-card h3 { color: #f8fafc; font-size: 1.2rem; margin-bottom: 6px; }
    .char-card p { font-size: 0.75rem; color: #38bdf8; margin: 0; }

    .btn { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none; padding: 16px 40px; font-size: 1.3rem; font-weight: bold; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 20px rgba(37,99,235,0.5); transition: transform 0.1s; }
    .btn:active { transform: scale(0.96); }

    /* HUD (Punkte & Münzen im Spiel) */
    #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; font-size: 1.2rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .hud-box { background: rgba(15, 23, 42, 0.7); padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); }

    /* Touch Controls für Mobile */
    #touch-controls { position: absolute; inset: 0; pointer-events: none; z-index: 50; display: flex; justify-content: space-between; padding: 25px; align-items: flex-end; }
    .touch-group { display: flex; gap: 15px; pointer-events: auto; }
    .touch-btn { width: 72px; height: 72px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.6rem; color: #fff; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .touch-btn:active { background: rgba(56,189,248,0.4); border-color: #38bdf8; transform: scale(0.92); }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <!-- HUD Ingame -->
  <div id="hud" class="hidden">
    <div class="hud-box" id="score-display">Schätze: 0</div>
    <div class="hud-box" id="char-display">Flo</div>
  </div>

  <!-- Startbildschirm -->
  <div id="start-overlay" class="overlay">
    <h1>Flohmarkt Schatzsuche</h1>
    <p class="subtitle">Wähle deinen Charakter und sammle seltene CardSkope Schätze ein!</p>
    
    <div class="char-select">
      <div class="char-card selected" id="card-flo" onclick="selectChar('Flo')">
        <h3>Flo</h3>
        <p>⚡ Agil & Schnell</p>
      </div>
      <div class="char-card" id="card-nico" onclick="selectChar('Nico')">
        <h3>Nico</h3>
        <p>🦘 Höherer Sprung</p>
      </div>
    </div>

    <button class="btn" onclick="startGame()">SPIEL STARTEN</button>
  </div>
</div>

<!-- Touch Steuerung -->
<div id="touch-controls" class="hidden">
  <div class="touch-group">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>
  <div class="touch-group">
    <div class="touch-btn" id="btn-jump" style="background: rgba(56,189,248,0.25); border-color: #38bdf8;">▲</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  
  let gameRunning = false;
  let score = 0;
  let selectedChar = 'Flo';

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function selectChar(char) {
    selectedChar = char;
    document.getElementById('card-flo').classList.toggle('selected', char === 'Flo');
    document.getElementById('card-nico').classList.toggle('selected', char === 'Nico');
  }

  // Spiel-Objekte
  const player = {
    x: 100, y: 100, width: 42, height: 64,
    vx: 0, vy: 0, speed: 6, jumpPower: -14, grounded: false
  };

  const keys = { left: false, right: false, up: false };

  // Tastatur Steuerung
  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if(e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
  });
  window.addEventListener('keyup', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if(e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
  });

  // Touch Buttons binden
  function bindTouch(id, keyName) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[keyName] = true; });
    el.addEventListener('touchend', e => { e.preventDefault(); keys[keyName] = false; });
    el.addEventListener('mousedown', () => keys[keyName] = true);
    el.addEventListener('mouseup', () => keys[keyName] = false);
  }
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-jump', 'up');

  // Flohmarkt Welt / Plattformen & Schätze
  const platforms = [
    { x: 0, y: window.innerHeight - 70, w: 4000, h: 70, type: 'ground' },
    { x: 300, y: window.innerHeight - 180, w: 180, h: 22, type: 'stand' },
    { x: 580, y: window.innerHeight - 280, w: 200, h: 22, type: 'stand' },
    { x: 860, y: window.innerHeight - 200, w: 180, h: 22, type: 'stand' },
    { x: 1140, y: window.innerHeight - 320, w: 220, h: 22, type: 'stand' }
  ];

  const treasures = [
    { x: 360, y: window.innerHeight - 230, collected: false },
    { x: 650, y: window.innerHeight - 330, collected: false },
    { x: 930, y: window.innerHeight - 250, collected: false },
    { x: 1220, y: window.innerHeight - 370, collected: false }
  ];

  let cameraX = 0;

  function startGame() {
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('touch-controls').classList.remove('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('char-display').innerText = 'Spieler: ' + selectedChar;

    if(selectedChar === 'Flo') {
      player.speed = 7;
      player.jumpPower = -14;
    } else {
      player.speed = 5.5;
      player.jumpPower = -16.5; // Nico springt höher
    }

    gameRunning = true;
    requestAnimationFrame(loop);
  }

  function loop() {
    if (!gameRunning) return;

    // Bewegung
    if (keys.left) player.vx = -player.speed;
    else if (keys.right) player.vx = player.speed;
    else player.vx *= 0.75;

    if (keys.up && player.grounded) {
      player.vy = player.jumpPower;
      player.grounded = false;
    }

    player.vy += 0.65; // Schwerkraft
    player.x += player.vx;
    player.y += player.vy;

    // Welt-Begrenzung links
    if (player.x < 0) player.x = 0;

    // Kollision Plattformen
    player.grounded = false;
    platforms.forEach(p => {
      if (player.x + player.width > p.x && player.x < p.x + p.w &&
          player.y + player.height > p.y && player.y + player.height - player.vy <= p.y) {
        player.grounded = true;
        player.vy = 0;
        player.y = p.y - player.height;
      }
    });

    // Kamera mitscrollen
    cameraX = player.x - canvas.width / 3;
    if (cameraX < 0) cameraX = 0;

    // Schätze einsammeln
    treasures.forEach(t => {
      if (!t.collected &&
          player.x < t.x + 35 && player.x + player.width > t.x - 10 &&
          player.y < t.y + 35 && player.y + player.height > t.y - 10) {
        t.collected = true;
        score += 100;
        document.getElementById('score-display').innerText = 'Schätze: ' + score;
      }
    });

    // --- ZEICHNEN ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Hintergrund-Deko (Flohmarkt Stände Andeutung)
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(100, canvas.height - 250, 200, 180);
    ctx.fillRect(500, canvas.height - 350, 220, 270);
    ctx.fillRect(900, canvas.height - 280, 240, 200);

    // Plattformen zeichnen
    platforms.forEach(p => {
      ctx.fillStyle = p.type === 'ground' ? '#1e293b' : '#334155';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p.x, p.y, p.w, 4); // Neon-Kante
    });

    // Schätze (CardSkope Karten) zeichnen
    treasures.forEach(t => {
      if (!t.collected) {
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(t.x, t.y, 25, 35);
        ctx.fillStyle = '#fff';
        ctx.fillRect(t.x + 4, t.y + 4, 17, 27);
      }
    });

    // Spieler zeichnen
    ctx.fillStyle = selectedChar === 'Flo' ? '#38bdf8' : '#fbbf24';
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Gesicht / Augen
    ctx.fillStyle = '#0f172a';
    let eyeOffsetX = player.vx >= 0 ? 24 : 6;
    ctx.fillRect(player.x + eyeOffsetX, player.y + 12, 8, 8);

    ctx.restore();

    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
